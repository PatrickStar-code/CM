/* ============ utilidades ============ */
function V3(x,y,z){return new THREE.Vector3(x,y,z);}
function fmt(n,d){if(d===undefined)d=1;return n.toFixed(d).replace('.',',');}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function mat(c,r,m,x){
  var o={color:c,roughness:(r===undefined?0.5:r),metalness:(m===undefined?0.6:m)};
  if(x){for(var k in x){o[k]=x[k];}}
  return new THREE.MeshStandardMaterial(o);
}
function hx(c){return '#'+('00000'+c.toString(16)).slice(-6);}
function EL(id){return document.getElementById(id);}

var renderer,scene,camera,clock,raycaster,ndc;
var CH=[],cur=0,tG=0;

/* ============ textura circular ============ */
var _dot=null;
function dotTex(){
  if(_dot)return _dot;
  var c=document.createElement('canvas');c.width=64;c.height=64;
  var x=c.getContext('2d');
  var g=x.createRadialGradient(32,32,0,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.4,'rgba(255,255,255,.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);
  _dot=new THREE.CanvasTexture(c);
  return _dot;
}

/* ============ partículas ============ */
function Sparks(n,o){
  o=o||{};
  this.n=n;
  this.g=(o.gravity===undefined?-5:o.gravity);
  this.bounce=(o.bounce!==false);
  this.maxLife=(o.maxLife||1.3);
  this.cursor=0;
  this.pos=new Float32Array(n*3);
  this.vel=new Float32Array(n*3);
  this.life=new Float32Array(n);
  for(var i=0;i<n;i++)this.pos[i*3+1]=-999;
  var geo=new THREE.BufferGeometry();
  this.attr=new THREE.BufferAttribute(this.pos,3);
  geo.setAttribute('position',this.attr);
  this.mat=new THREE.PointsMaterial({
    color:(o.color===undefined?0xffa94d:o.color),
    size:(o.size===undefined?0.13:o.size),
    map:dotTex(),transparent:true,
    opacity:(o.opacity===undefined?0.95:o.opacity),
    depthWrite:false,
    blending:(o.additive===false?THREE.NormalBlending:THREE.AdditiveBlending)
  });
  this.points=new THREE.Points(geo,this.mat);
  this.points.frustumCulled=false;
}
Sparks.prototype.emit=function(p,k,spd,up,jit){
  spd=spd||2.5;if(up===undefined)up=2.8;if(jit===undefined)jit=0.7;
  for(var i=0;i<k;i++){
    var j=this.cursor=(this.cursor+1)%this.n;
    this.pos[j*3]=p.x+(Math.random()-.5)*jit;
    this.pos[j*3+1]=p.y+(Math.random()-.5)*jit*.5;
    this.pos[j*3+2]=p.z+(Math.random()-.5)*jit;
    this.vel[j*3]=(Math.random()-.5)*spd;
    this.vel[j*3+1]=Math.random()*up+.4;
    this.vel[j*3+2]=(Math.random()-.5)*spd;
    this.life[j]=this.maxLife*(.4+Math.random()*.6);
  }
};
Sparks.prototype.update=function(dt){
  for(var i=0;i<this.n;i++){
    if(this.life[i]<=0)continue;
    this.life[i]-=dt;
    if(this.life[i]<=0){this.pos[i*3+1]=-999;continue;}
    this.vel[i*3+1]+=this.g*dt;
    this.pos[i*3]+=this.vel[i*3]*dt;
    this.pos[i*3+1]+=this.vel[i*3+1]*dt;
    this.pos[i*3+2]+=this.vel[i*3+2]*dt;
    if(this.bounce&&this.pos[i*3+1]<.02){
      this.pos[i*3+1]=.02;this.vel[i*3+1]*=-.35;this.vel[i*3]*=.7;this.vel[i*3+2]*=.7;
    }
  }
  this.attr.needsUpdate=true;
};

/* ============ rótulos 3D ============ */
function makeLabel(lines,o){
  o=o||{};
  var fs=o.fs||34,padX=24,padY=14,lh=fs*1.25;
  var cv=document.createElement('canvas');
  var cx=cv.getContext('2d');
  var fnt='600 '+fs+'px Consolas, monospace';
  cx.font=fnt;
  var w=0;
  for(var i=0;i<lines.length;i++)w=Math.max(w,cx.measureText(lines[i]).width);
  cv.width=Math.ceil(w+padX*2);
  cv.height=Math.ceil(lh*lines.length+padY*2);
  cx.font=fnt;cx.textAlign='center';cx.textBaseline='middle';
  var r=14,W=cv.width,H=cv.height;
  cx.beginPath();
  cx.moveTo(r,1);cx.arcTo(W-1,1,W-1,H-1,r);cx.arcTo(W-1,H-1,1,H-1,r);
  cx.arcTo(1,H-1,1,1,r);cx.arcTo(1,1,W-1,1,r);cx.closePath();
  cx.fillStyle='rgba(7,12,20,.8)';cx.fill();
  cx.strokeStyle='rgba(148,163,184,.4)';cx.lineWidth=2;cx.stroke();
  if(o.accent!==undefined){
    cx.fillStyle=hx(o.accent);
    cx.fillRect(6,9,5,H-18);
  }
  cx.fillStyle='#dde7f3';
  for(var j=0;j<lines.length;j++)cx.fillText(lines[j],W/2,padY+lh*(j+.5));
  var tex=new THREE.CanvasTexture(cv);
  tex.minFilter=THREE.LinearFilter;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  var s=o.scale||0.005;
  sp.scale.set(cv.width*s,cv.height*s,1);
  return sp;
}

/* ============ ambiente PMREM ============ */
function makeEnvironment(){
  try{
    var c=document.createElement('canvas');c.width=256;c.height=128;
    var g=c.getContext('2d');
    var gr=g.createLinearGradient(0,0,0,128);
    gr.addColorStop(0,'#20304c');gr.addColorStop(.45,'#101c30');
    gr.addColorStop(.5,'#2a3c55');gr.addColorStop(.56,'#16202f');gr.addColorStop(1,'#080d16');
    g.fillStyle=gr;g.fillRect(0,0,256,128);
    g.fillStyle='rgba(255,205,160,.9)';g.fillRect(36,20,52,9);
    g.fillStyle='rgba(160,200,255,.8)';g.fillRect(150,28,72,8);
    g.fillStyle='rgba(255,255,255,.5)';g.fillRect(88,58,110,4);
    var tex=new THREE.CanvasTexture(c);
    tex.mapping=THREE.EquirectangularReflectionMapping;
    var pm=new THREE.PMREMGenerator(renderer);
    var env=pm.fromEquirectangular(tex).texture;
    pm.dispose();tex.dispose();
    return env;
  }catch(e){return null;}
}

function renderStageCard(i){

/* ============================================================
   CAPÍTULO 1 — ciclo infinito (etapas clicáveis)
   ============================================================ */
function buildCap1(){
  var g=new THREE.Group();
  var R=6,A0=Math.PI/2;
  var podGeo=new THREE.CylinderGeometry(.62,.8,.16,28);
  var podMat=mat(0x192437,.6,.55);
  var pods=[],rings=[],hits=[];
  STAGES.forEach(function(s,i){
    var a=A0+i*Math.PI/3;
    var x=Math.cos(a)*R,z=Math.sin(a)*R;
    var pod=new THREE.Mesh(podGeo,podMat);pod.position.set(x,.08,z);g.add(pod);

    pods.push(pod);rings.push(ring);hits.push(hit);
  });
  var guide=new THREE.Mesh(new THREE.TorusGeometry(R,.035,8,140),mat(0x24344c,.5,.7));
  guide.rotation.x=Math.PI/2;guide.position.y=.05;g.add(guide);
  var coneGeo=new THREE.ConeGeometry(.13,.34,14);coneGeo.rotateX(Math.PI/2);
  var coneMat=mat(0x9fb2c8,.35,.85,{emissive:0x22344c,emissiveIntensity:.4});
  var ci=0;
  for(ci=0;ci<3;ci++){
    var aa=A0+ci*2.094+.52;
    var cone=new THREE.Mesh(coneGeo,coneMat);
    cone.position.set(Math.cos(aa)*R,.17,Math.sin(aa)*R);
    cone.lookAt(V3(Math.cos(aa+.12)*R,.17,Math.sin(aa+.12)*R));
    g.add(cone);
  }
  var fa=A0+4*Math.PI/3;
  var hot=new THREE.PointLight(0xff8a3f,0,10,2);
  hot.position.set(Math.cos(fa)*R,2.2,Math.sin(fa)*R);g.add(hot);

  var beamMat=mat(0xc3d2e4,.28,.92,{emissive:0x9fd4ff,emissiveIntensity:0});
  var scrapMat=mat(0x8b99ab,.55,.72);
  var ingotMat=mat(0xffb27a,.35,.55,{emissive:0xff5a1f,emissiveIntensity:1.15});
  var beam=new THREE.Group();
  var web=new THREE.Mesh(new THREE.BoxGeometry(1.7,.34,.07),beamMat);
  var fl1=new THREE.Mesh(new THREE.BoxGeometry(1.7,.08,.36),beamMat);fl1.position.y=.21;
  var fl2=fl1.clone();fl2.position.y=-.21;
  beam.add(web,fl1,fl2);
  var scrap=new THREE.Group();
  var k=0;
  for(k=0;k<5;k++){
    var d=new THREE.Mesh(new THREE.DodecahedronGeometry(.15+Math.random()*.09),scrapMat);
    d.position.set((Math.random()-.5)*.5,(Math.random()-.5)*.3,(Math.random()-.5)*.5);
    d.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    scrap.add(d);
  }
  var igGeo=new THREE.CylinderGeometry(.24,.38,.55,4);igGeo.rotateY(Math.PI/4);
  var ingot=new THREE.Group();ingot.add(new THREE.Mesh(igGeo,ingotMat));
  var forms=[beam,scrap,ingot];
  forms.forEach(function(o){o.traverse(function(m){if(m.isMesh)m.castShadow=true;});});
  var pellet=new THREE.Group();pellet.add(beam,scrap,ingot);g.add(pellet);
  var sw=new Sparks(140,{color:0xcfe0ff,size:.11});g.add(sw.points);

  var st={total:0,last:0,cycles:0,spd:1,boost:0,pop:0,flash:0,sel:-1,follow:true};
  var speeds=[.22,.5,1.15];

  function highlight(){
    for(var i=0;i<6;i++){
      var on=(i===st.sel);
      rings[i].material.emissiveIntensity=on?1.3:.55;
      pods[i].scale.setScalar(on?1.14:1);
    }
  }
  function pickStage(i){
    st.follow=false;setFollowBtn();
    st.sel=(st.sel===i?-1:i);
    if(st.sel>=0)renderStageCard(st.sel);else renderHintCard();
    highlight();
  }

  return {
    group:g,speed:st,st:st,highlight:highlight,
    cam:{theta:.75,elev:.5,radius:13.5,target:V3(0,.7,0),min:7,max:24},
    clickables:(function(){
      var list=[{obj:pellet,handler:function(){
        st.boost=1;var p=pellet.position;sw.emit(V3(p.x,p.y,p.z),12,3,3.5,.6);
      }}];
      for(var i=0;i<6;i++)(function(idx){
        list.push({obj:hits[idx],handler:function(){pickStage(idx);}});
      })(i);
      return list;
    })(),
    enter:function(){
      if(st.follow)renderStageCard(st.last);
      else if(st.sel>=0)renderStageCard(st.sel);
      else renderHintCard();
      highlight();
      setM('m1-cyc',String(st.cycles));
    },
    update:function(dt,t){
      st.boost=Math.max(0,st.boost-dt*1.1);
      st.total+=(speeds[st.spd]+st.boost*7)*dt;
      st.pop*=Math.exp(-dt*4.5);st.flash*=Math.exp(-dt*1.6);
      beamMat.emissiveIntensity=st.flash;
      var idx=Math.floor(st.total/(Math.PI/3))%6;
      if(idx!==st.last){
        st.last=idx;st.pop=1;
        beam.visible=(idx===0||idx===1||idx===5);
        scrap.visible=(idx===2||idx===3);
        ingot.visible=(idx===4);
        if(idx===4)hot.intensity=2.6;
        if(idx===5){st.flash=.9;var p2=pellet.position;sw.emit(V3(p2.x,p2.y,p2.z),16,2.5,3,.8);}
        var cy=Math.floor(st.total/(Math.PI*2));
        if(cy>st.cycles){
          st.cycles=cy;setM('m1-cyc',String(cy));
          toast('Ciclo '+cy+' concluído — 0% de perda de qualidade');
        }
        if(st.follow){st.sel=idx;renderStageCard(idx);}
        highlight();
      }
      if(st.sel>=0)rings[st.sel].material.emissiveIntensity=1.1+Math.sin(t*5)*.25;
      hot.intensity*=Math.exp(-dt*2.2);
      var ang=A0+st.total;
      pellet.position.set(Math.cos(ang)*R,.66+Math.sin(t*2.1)*.07,Math.sin(ang)*R);
      pellet.rotation.y+=dt*1.1;
      pellet.scale.setScalar(1+st.pop*.4);
      sw.update(dt);
    }
  };
}
function setFollowBtn(){
  var b=EL('btn-follow');
  if(b&&CH[0])b.textContent='Seguir a peleta: '+(CH[0].st.follow?'ON':'OFF');
}

      var roof=new THREE.Mesh(new THREE.BoxGeometry(2.06,.08,1.36),mat(0x283243,.7,.4));

    }
    var cMat=mat(0x1d4a3c,.6,.45);
    var base=new THREE.Mesh(new THREE.BoxGeometry(1.5,.1,1),cMat);base.position.set(.1,.08,1.1);
    var wl=new THREE.Mesh(new THREE.BoxGeometry(.06,.5,1),cMat);wl.position.set(-.65,.36,1.1);
    var wr=wl.clone();wr.position.x=.85;
    var bf=new THREE.Mesh(new THREE.BoxGeometry(1.5,.5,.06),cMat);bf.position.set(.1,.36,.62);
    var bb=bf.clone();bb.position.z=1.58;
    var sides=[base,wl,wr,bf,bb];

    ping.rotation.x=Math.PI/2;ping.position.set(.1,.12,1.1);ping.visible=false;s.add(ping);

      dock:V3(d.pos.x+.1,0,d.pos.z+2.4),wx:d.pos.x+.1,wz:d.pos.z+1.1});

  var w=V3(9,0,-2.5);
  var phall=new THREE.Mesh(new THREE.BoxGeometry(4.4,2.1,2.8),mat(0x2b3648,.72,.4));
  phall.position.set(w.x,1.05,w.z);g.add(phall);
  var proof=new THREE.Mesh(new THREE.BoxGeometry(4.5,.12,2.9),mat(0x202c3d,.7,.4));
  proof.position.set(w.x,2.16,w.z);g.add(proof);
  var pdoor=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.15,.1),
    mat(0x10241d,.5,.3,{emissive:0x1f5c46,emissiveIntensity:.55}));
  pdoor.position.set(w.x-.6,.58,w.z+1.46);g.add(pdoor);
  var pchm=new THREE.Mesh(new THREE.CylinderGeometry(.24,.34,2.6,14),mat(0x243040,.6,.5));
  pchm.position.set(w.x+1.5,3.4,w.z-.8);g.add(pchm);
  var sign=makeLabel(['USINA','FORNO ELÉTRICO'],{fs:34,scale:.005,accent:0xff7a2f});
  sign.position.set(w.x,4.9,w.z);g.add(sign);
  var dockM=new THREE.Mesh(new THREE.CircleGeometry(1.15,36),
    mat(0x123024,.8,.1,{emissive:0x1f5c46,emissiveIntensity:.3}));
  dockM.rotation.x=-Math.PI/2;dockM.position.set(w.x,.02,w.z+2.6);g.add(dockM);
  var werkDock=V3(w.x,0,w.z+2.6);

  var smoke=new Sparks(110,{color:0x5c6878,size:.55,gravity:.12,opacity:.15,additive:false,maxLife:3.4,bounce:false});
  g.add(smoke.points);
  var sg=new Sparks(120,{color:0x3ddc97,size:.12});g.add(sg.points);

  var truck=new THREE.Group();
  var cab=new THREE.Mesh(new THREE.BoxGeometry(1,.78,.9),mat(0xff7a2f,.45,.4));cab.position.set(0,.72,.95);
  var glass=new THREE.Mesh(new THREE.BoxGeometry(.92,.34,.1),

  var bbase=new THREE.Mesh(new THREE.BoxGeometry(1.14,.10,1.95),mat(0x33425a,.6,.5));bbase.position.set(0,.58,-.85);
  var lw=new THREE.Mesh(new THREE.BoxGeometry(.07,.42,1.95),mat(0x33425a,.6,.5));lw.position.set(-.535,.84,-.85);

  var hd=tw.clone();hd.position.z=.12;
  truck.add(cab,glass,chas,bbase,lw,rw,tw,hd);
  var wg=new THREE.CylinderGeometry(.3,.3,.22,16);wg.rotateZ(Math.PI/2);
  var wheels=[];
  var zs=[1.1,-.35,-1.35];
  for(var zi=0;zi<zs.length;zi++){
    var xs2=[-.56,.56];
    for(var xi=0;xi<xs2.length;xi++){
      var wh=new THREE.Mesh(wg,mat(0x11161f,.9,.1));
      wh.position.set(xs2[xi],.3,zs[zi]);wh.castShadow=true;
      truck.add(wh);wheels.push(wh);
    }
  }
  var cargoG=new THREE.Group();cargoG.position.set(0,.9,-.85);
  var cargoMeshes=[];
  for(var cc=0;cc<8;cc++){
    var cd=new THREE.Mesh(new THREE.DodecahedronGeometry(.13+Math.random()*.06),scrapMat);
    cd.position.set((Math.random()-.5)*.7,Math.random()*.35,(Math.random()-.5)*1.4);
    cd.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    cd.visible=false;cargoG.add(cd);cargoMeshes.push(cd);
  }
  truck.add(cargoG);
  truck.position.copy(werkDock);g.add(truck);

  var st={mode:'idle',curve:null,t:0,len:1,queue:[],cidx:-1,cargo:0,dumpAmt:0,timer:0,trips:0,collected:0};
  var CAP=2.2,VTR=4.4;

  function routeTo(a,b){
    var dir=b.clone().sub(a).normalize();
    var perp=V3(-dir.z,0,dir.x).multiplyScalar(1.6);
    var p1=a.clone().lerp(b,.3).add(perp);
    var p2=a.clone().lerp(b,.7).sub(perp);
    return new THREE.CatmullRomCurve3([a,p1,p2,b]);
  }
  function next(){
    if(st.queue.length){
      var i=st.queue.shift();st.cidx=i;st.mode='drive';
      st.curve=routeTo(truck.position.clone().setY(0),sites[i].dock);
      st.t=0;st.len=Math.max(st.curve.getLength(),.01);
    }else{
      st.mode='home';
      st.curve=routeTo(truck.position.clone().setY(0),werkDock);
      st.t=0;st.len=Math.max(st.curve.getLength(),.01);
    }
  }
  function request(i){
    if(st.cidx===i||st.queue.indexOf(i)>=0){toast('Coleta já a caminho deste ponto');return;}
    if(sites[i].level<.12){toast(sites[i].name+': carga insuficiente — aguarde acumular');return;}
    st.queue.push(i);sites[i].ping.visible=true;
    if(st.mode==='idle')next();

    update:function(dt,t){

        if(!(st.mode==='collect'&&sites[st.cidx]===s))s.level=Math.min(1,s.level+dt*.03);
        s.pile.scale.setScalar(.3+.7*s.level);
        s.pile.visible=s.level>.03;
        if(s.ping.visible)s.ping.scale.setScalar(1+.2*Math.sin(t*5));
      });
      if(Math.random()<.3)smoke.emit(V3(w.x+1.5,4.75,w.z-.8),1,.25,.6,.3);
      if(st.mode==='drive'||st.mode==='home'){
        st.t+=VTR*dt/st.len;
        var p=st.curve.getPoint(Math.min(st.t,1));
        var q=st.curve.getPoint(Math.min(st.t+.03,1));
        truck.position.copy(p);truck.lookAt(q);
        wheels.forEach(function(wh){wh.rotation.x+=VTR*dt/.3;});
        if(st.t>=1){
          if(st.mode==='drive'){
            st.mode='collect';st.timer=1.5;
            var s0=sites[st.cidx];
            s0.level0=s0.level;s0.ping.visible=false;
          }else if(st.cargo>.01){
            st.mode='dump';st.timer=1.3;st.dumpAmt=st.cargo;
          }else{
            if(st.queue.length)next();else st.mode='idle';
          }
        }
      }else if(st.mode==='collect'){
        st.timer-=dt;
        var s2=sites[st.cidx];
        var kk2=Math.max(0,st.timer/1.5);
        s2.level=s2.level0*kk2;
        if(Math.random()<.3)sg.emit(V3(s2.wx,.7,s2.wz),1,1.5,2,.8);
        if(st.timer<=0){st.cargo+=s2.level0*CAP;s2.level=0;cargoVis();next();}
      }else if(st.mode==='dump'){
        st.timer-=dt;
        st.cargo=st.dumpAmt*Math.max(0,st.timer/1.3);cargoVis();
        if(Math.random()<.35)sg.emit(V3(w.x,.5,w.z+2.6),1,1.8,2.2,.9);
        if(st.timer<=0){
          st.collected+=st.dumpAmt;st.trips++;st.cargo=0;cargoVis();
          toast('Descarga na usina: '+fmt(st.dumpAmt,1)+' t de sucata reciclável');
          st.cidx=-1;next();
        }
      }
      sg.update(dt);smoke.update(dt);
      if(d2.p0){
        var avg=(sites[0].level+sites[1].level+sites[2].level)/3;
        sites.forEach(function(s,i){
          d2['p'+i].style.width=(s.level*100)+'%';
          d2['p'+i+'v'].textContent=Math.round(s.level*100)+'%';
          var lv=d2['p'+i].closest('.lv');
          if(lv)lv.classList.toggle('hot',s.level>.85);
        });
        d2['m2-ton'].textContent=fmt(st.collected,1)+' t';
        d2['m2-rate'].textContent=Math.max(0,Math.round(100-avg*100))+'%';
        d2['m2-trips'].textContent=st.trips;
      }
    }
  };
}

  function setMeters(){
    if(!d3.bfBar)return;

    d3.eafVal.textContent=fmt(st.eafE,1);
  }
  function reset(){
    st.eafE=0;st.bfE=0;st.cool=0;st.fill=0;
    scrapGrp.scale.setScalar(1);
    scrapMat.emissiveIntensity=0;
    bathMat.emissiveIntensity=.12;

    if(st.phase==='idle'){
      st.phase='lower';st.t=0;
      if(d3.btn){d3.btn.disabled=true;d3.btn.textContent='Fundindo…';}
    }else if(st.phase==='done'){
      st.phase='idle';
      reset();
      if(d3.btn){d3.btn.disabled=false;d3.btn.textContent='Iniciar fusão';}
    }
  }
  function enter(){
    setMeters();
    if(d3.btn){
      d3.btn.disabled=!(st.phase==='idle'||st.phase==='done');
      d3.btn.textContent=st.phase==='done'?'Nova carga':'Iniciar fusão';
    }
  }
  function update(dt,t){
    st.t+=dt;
    if(st.phase==='lower'){
      st.eleY=lerp(2.6,TIP,easeOut(Math.min(1,st.t/1.1)));
      if(st.t>=1.1){st.phase='arc';st.t=0;}
    }else if(st.phase==='arc'){
      var k=Math.min(1,st.t/4.6);
      st.eafE=5.4*k;st.bfE=19.8*k;
      lamp.intensity=2.8+Math.sin(t*42)*.9+Math.random()*.5;
      arcs.forEach(function(a){
        a.material.opacity=.45+Math.random()*.5;
        a.scale.y=Math.max(.05,st.eleY-1.42);
        a.position.y=(st.eleY+1.42)/2;
      });
      scrapGrp.scale.setScalar(Math.max(.06,1-.94*k));
      scrapMat.emissiveIntensity=.7*k;
      bathMat.emissiveIntensity=.12+1.35*k;
      rim.material.emissiveIntensity=.25*k;
      doorGlowMat.opacity=.25+.35*Math.abs(Math.sin(t*7));
      if(Math.random()<.75){
        var o=eOffs[Math.floor(Math.random()*3)];
        so.emit(V3(ex+o[0],st.eleY,o[1]),2,2.2,3.2,1.1);
      }
      if(Math.random()<.5)smokeBF.emit(V3(ex+1.0,3.45,-1.1),1,.3,.7,.25);
      setMeters();
      if(st.t>=4.6){st.phase='raise';st.t=0;}
    }else if(st.phase==='raise'){
      st.eleY=lerp(TIP,2.6,easeOut(Math.min(1,st.t/1.1)));
      lamp.intensity*=Math.exp(-dt*3);
      arcs.forEach(function(a){a.material.opacity*=.86;});
      doorGlowMat.opacity*=.9;
      if(st.t>=1.1){st.phase='pour';st.t=0;ladle.visible=true;stream.visible=true;}
    }else if(st.phase==='pour'){
      var kk=Math.min(1,st.t/1.7);
      st.fill=kk;
      lglow.scale.y=Math.max(.05,kk);
      lglow.position.y=.28+.3*kk;
      lglowMat.emissiveIntensity=.6+kk*1.2;
      stream.material.opacity=.7+Math.random()*.3;
      if(Math.random()<.6)so.emit(V3(ex,1.05,3.55),2,1.6,2.2,.5);
      if(st.t>=1.7){
        st.phase='done';st.cool=0;lamp.intensity=0;
        arcs.forEach(function(a){a.material.opacity=0;});
        stream.visible=false;
        st.flash=1;
        toast('Panela cheia — 5,4 GJ/t contra 19,8 GJ/t na rota de minério (−73%)');
        if(d3.btn){d3.btn.disabled=false;d3.btn.textContent='Nova carga';}
      }
    }else if(st.phase==='done'){
      st.cool+=dt;
      lglowMat.emissiveIntensity=lerp(1.8,.12,Math.min(1,st.cool/7));
      bathMat.emissiveIntensity=lerp(1.47,.4,Math.min(1,st.cool/5));
      scrapMat.emissiveIntensity*=Math.exp(-dt*1.5);
      rim.material.emissiveIntensity*=Math.exp(-dt*1.5);
      doorGlowMat.opacity*=Math.exp(-dt*1.5);
    }
    st.flash*=Math.exp(-dt*2);
    barEAFmat.emissiveIntensity=.25+st.flash*1.4;
    st.barAnim=Math.min(1,st.barAnim+dt*.7);
    var e=easeOut(st.barAnim);
    barBF.scale.y=Math.max(.02,HBF*e);
    barEAF.scale.y=Math.max(.02,HEAF*e);
    eleGroup.position.y=st.eleY;
    beaconMat.opacity=.4+.6*Math.abs(Math.sin(t*2.4));
    if(st.phase!=='arc'&&st.phase!=='pour'&&Math.random()<.2)smokeBF.emit(V3(bx,6.45,bz),1,.25,.55,.3);
    so.update(dt);smokeBF.update(dt);
  }
  return {group:g,st:st,
    cam:{theta:-.55,elev:.42,radius:13.5,target:V3(0,1.9,0),min:7,max:22},
    clickables:[],btnAction:btnAction,enter:enter,update:update};
}

    }),

    update:update};
}
function renderCard(k){
  var el=EL('seal-card');if(!el)return;
  if(!k){
    el.innerHTML='<h4>Selecione um selo</h4><p>Na cena 3D ou nos botões ao lado, para abrir a ficha técnica e os dados ambientais.</p>';
    return;
  }
  var f=FICHAS[k];
  var tags='';
  for(var i=0;i<f.chips.length;i++)tags+='<i>'+f.chips[i]+'</i>';
  el.innerHTML='<h4>'+f.t+'</h4><p>'+f.d+'</p><div class="tags">'+tags+'</div>';
}
function selectSeal(k){
  if(!CH[3])return;
  var st=CH[3].st;
  st.sel=(st.sel===k?null:k);
  renderCard(st.sel);syncSealChips();
}
function syncSealChips(){
  var s=(CH[3]&&CH[3].st)?CH[3].st.sel:null;
  var btns=document.querySelectorAll('#seals button');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i].getAttribute('data-k')===s);
}

/* ============ painel / navegação ============ */
function setM(id,txt){var el=EL(id);if(el)el.textContent=txt;}
var toastT;
function toast(msg){
  var el=EL('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.classList.remove('on');},3000);
}
function updatePanel(){
  var u=UI[cur];
  setM('k-kick','CAPÍTULO '+u.num+' · 04');
  setM('k-num',u.num);
  setM('k-title',u.title);
  EL('k-desc').innerHTML=u.desc;
  EL('k-controls').innerHTML=u.controls;
  EL('k-mets').innerHTML=u.metrics;
  setM('k-hint',u.hint);
  var chips=document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++)chips[i].classList.toggle('active',i===cur);
  var segs=document.querySelectorAll('.segs button');
  for(var j=0;j<segs.length;j++)segs[j].classList.toggle('active',j<=cur);
  setM('count','0'+(cur+1)+' / 04');
  bindControls(cur);
}
function bindControls(i){
  if(i===0){
    var st=CH[0].speed;
    var btns=document.querySelectorAll('#spd button');
    for(var k=0;k<btns.length;k++){
      (function(b){
        b.classList.toggle('on',parseInt(b.getAttribute('data-s'),10)===st.spd);
        b.onclick=function(){
          st.spd=parseInt(b.getAttribute('data-s'),10);
          for(var q=0;q<btns.length;q++)btns[q].classList.toggle('on',btns[q]===b);
        };
      })(btns[k]);
    }
    var fb=EL('btn-follow');
    fb.onclick=function(){
      var s=CH[0].st;
      s.follow=!s.follow;
      setFollowBtn();
      if(s.follow){s.sel=s.last;renderStageCard(s.last);}
      else{s.sel=-1;renderHintCard();}
      CH[0].highlight();
    };
    if(st.follow)renderStageCard(st.last);
    else if(st.sel>=0)renderStageCard(st.sel);
    else renderHintCard();
    setFollowBtn();
    CH[0].highlight();
  }
  if(i===1){
    var ids=['p0','p1','p2','p0v','p1v','p2v','m2-ton','m2-rate','m2-trips'];
    for(var q2=0;q2<ids.length;q2++)d2[ids[q2]]=EL(ids[q2]);
    EL('btn-demo').onclick=function(){
      var s=CH[1].sites[Math.floor(Math.random()*3)];
      s.level=Math.min(1,s.level+.5+Math.random()*.4);
      toast('Demolição registrada em '+s.name+' — sucata disponível para coleta');
    };
  }
  if(i===2){
    d3.btn=EL('btn-melt');
    d3.bfBar=EL('bf-bar');d3.eafBar=EL('eaf-bar');
    d3.bfVal=EL('bf-val');d3.eafVal=EL('eaf-val');
    d3.btn.onclick=function(){CH[2].btnAction();};
    CH[2].enter();
  }
  if(i===3){
    var sb=document.querySelectorAll('#seals button');
    for(var q3=0;q3<sb.length;q3++){
      (function(b){b.onclick=function(){selectSeal(b.getAttribute('data-k'));};})(sb[q3]);
    }
    renderCard(CH[3].st.sel);syncSealChips();
  }
}
function setChapter(i,instant){
  if(!instant&&i===cur)return;
  cur=i;
  var apply=function(){
    CH.forEach(function(c,j){c.group.visible=(j===i);});
    var c=CH[i].cam;
    rig.theta=c.theta;rig.elev=c.elev;rig.radius=c.radius;rig.target.copy(c.target);
    updatePanel();
    if(i!==2&&CH[i].enter)CH[i].enter();
  };
  if(instant){apply();return;}
  EL('veil').classList.add('on');
  setTimeout(function(){
    apply();
    requestAnimationFrame(function(){EL('veil').classList.remove('on');});
  },380);
}

/* ============ boot ============ */
function boot(){
  var load=EL('loading');
  try{
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.12;
    renderer.domElement.id='stage';
    document.body.insertBefore(renderer.domElement,document.body.firstChild);

    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a101c);
    scene.fog=new THREE.Fog(0x0a101c,45,120);
    camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,220);
    raycaster=new THREE.Raycaster();ndc=new THREE.Vector2();
    clock=new THREE.Clock();

    var env=makeEnvironment();
    if(env)scene.environment=env;
    scene.add(new THREE.HemisphereLight(0x8fb3d9,0x0c1118,.55));
    var key=new THREE.DirectionalLight(0xfff1e0,1);
    key.position.set(8,13,6);key.castShadow=true;
    key.shadow.mapSize.set(2048,2048);
    key.shadow.camera.left=key.shadow.camera.bottom=-18;
    key.shadow.camera.right=key.shadow.camera.top=18;
    key.shadow.camera.near=2;key.shadow.camera.far=45;
    key.shadow.normalBias=.03;
    scene.add(key);
    var rimL=new THREE.DirectionalLight(0x5b8cff,.35);
    rimL.position.set(-9,6,-9);scene.add(rimL);

    var ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x0d1522,.95,0));
    ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    var grid=new THREE.GridHelper(90,60,0x24354e,0x16233a);
    grid.position.y=.02;grid.material.transparent=true;grid.material.opacity=.5;scene.add(grid);

    CH=[buildCap1(),buildCap2(),buildCap3(),buildCap4()];
    CH.forEach(function(c,i){c.group.visible=(i===0);scene.add(c.group);});

    var chips=document.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){
      (function(b){b.onclick=function(){setChapter(parseInt(b.getAttribute('data-i'),10));};})(chips[i]);
    }
    var segs=document.querySelectorAll('.segs button');
    for(var j=0;j<segs.length;j++){
      (function(b){b.onclick=function(){setChapter(parseInt(b.getAttribute('data-i'),10));};})(segs[j]);
    }
    EL('b-prev').onclick=function(){setChapter((cur+3)%4);};
    EL('b-next').onclick=function(){setChapter((cur+1)%4);};
    EL('fold').onclick=function(){EL('panel').classList.toggle('off');};
    window.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight')setChapter((cur+1)%4);
      if(e.key==='ArrowLeft')setChapter((cur+3)%4);
    });

    var cvs=renderer.domElement;
    cvs.addEventListener('pointerdown',function(e){
      drag=true;moved=0;px=e.clientX;py=e.clientY;
      try{cvs.setPointerCapture(e.pointerId);}catch(_e){}
    });
    cvs.addEventListener('pointermove',function(e){
      if(drag){
        var dx=e.clientX-px,dy=e.clientY-py;
        px=e.clientX;py=e.clientY;
        moved+=Math.abs(dx)+Math.abs(dy);
        rig.theta-=dx*.0052;
        rig.elev=clamp(rig.elev+dy*.0042,.1,1.3);
      }else hoverCheck(e);
    });
    cvs.addEventListener('pointerup',function(e){
      drag=false;
      if(moved<7)clickCheck(e);
    });
    cvs.addEventListener('pointercancel',function(){drag=false;});
    cvs.addEventListener('wheel',function(e){
      e.preventDefault();
      var c=CH[cur].cam;
      rig.radius=clamp(rig.radius+e.deltaY*.012,c.min,c.max);
    },{passive:false});
    window.addEventListener('resize',function(){
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    setChapter(0,true);
    if(load&&load.parentNode)load.parentNode.removeChild(load);
    animate();
  }catch(e){
    if(load&&load.parentNode)load.parentNode.removeChild(load);
    fatal('Falha ao iniciar a cena 3D: '+(e&&e.message?e.message:e));
  }
}

/* ============ picking ============ */
function pick(e){
  if(!CH.length||!CH[cur])return null;
  var r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  var list=CH[cur].clickables||[];
  if(!list.length)return null;
  var hits=raycaster.intersectObjects(list.map(function(l){return l.obj;}),true);
  if(!hits.length)return null;
  var o=hits[0].object;
  while(o){
    for(var i=0;i<list.length;i++){if(list[i].obj===o)return list[i];}
    o=o.parent;
  }
  return null;
}
function hoverCheck(e){
  var l=pick(e);
  renderer.domElement.style.cursor=l?'pointer':'grab';
}
function clickCheck(e){
  var l=pick(e);
  if(l)l.handler();
}

/* ============ loop ============ */
function updateCamera(dt){
  if(!drag)rig.theta+=dt*.03;
  var cp=Math.cos(rig.elev),sp=Math.sin(rig.elev);
  camera.position.set(
    rig.target.x+rig.radius*cp*Math.sin(rig.theta),
    rig.target.y+rig.radius*sp,
    rig.target.z+rig.radius*cp*Math.cos(rig.theta));
  camera.lookAt(rig.target);
}
function animate(){
  if(dead)return;
  requestAnimationFrame(animate);
  try{
    var dt=Math.min(clock.getDelta(),.05);
    tG+=dt;
    if(CH[cur]&&CH[cur].update)CH[cur].update(dt,tG);
    updateCamera(dt);
    renderer.render(scene,camera);
  }catch(e){
    dead=true;
    fatal('Erro durante a animação: '+(e&&e.message?e.message:e));
  }
}

boot();
})();
</script>
