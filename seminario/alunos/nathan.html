<script>
(function(){
'use strict';

if(typeof THREE==='undefined'){
  fatal('A biblioteca Three.js não carregou — verifique a conexão com a internet e recarregue (F5).');

/* ============ utilidades ============ */
function V3(x,y,z){return new THREE.Vector3(x,y,z);}
function fmt(n,d){if(d===undefined)d=1;return n.toFixed(d).replace('.',',');}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,k){return a+(b-a)*k;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function mat(c,r,m,x){
  var o={color:c,roughness:(r===undefined?0.5:r),metalness:(m===undefined?0.6:m)};
  if(x){for(var k in x){o[k]=x[k];}}
  return new THREE.MeshStandardMaterial(o);
}
function hx(c){return '#'+('00000'+c.toString(16)).slice(-6);}
function EL(id){return document.getElementById(id);}

var renderer,scene,camera,clock,raycaster,ndc;
var CH=[],cur=0,tG=0;
var rig={theta:0.7,elev:0.45,radius:14,target:V3(0,1,0)};
var drag=false,px=0,py=0,moved=0;
var C1={},C2={},C3={},C4={},C5={};
var dead=false;

/* ============ textura circular ============ */
var _dot=null;
function dotTex(){
  if(_dot)return _dot;
  var c=document.createElement('canvas');c.width=64;c.height=64;
  var x=c.getContext('2d');
  var g=x.createRadialGradient(32,32,0,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.4,'rgba(255,255,255,.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);
  _dot=new THREE.CanvasTexture(c);
  return _dot;
}

/* ============ partículas (física simples) ============ */
function Sparks(n,o){
  o=o||{};
  this.n=n;
  this.g=(o.gravity===undefined?-5:o.gravity);
  this.bounce=(o.bounce!==false);
  this.maxLife=(o.maxLife||1.3);
  this.cursor=0;
  this.pos=new Float32Array(n*3);
  this.vel=new Float32Array(n*3);
  this.life=new Float32Array(n);
  for(var i=0;i<n;i++)this.pos[i*3+1]=-999;
  var geo=new THREE.BufferGeometry();
  this.attr=new THREE.BufferAttribute(this.pos,3);
  geo.setAttribute('position',this.attr);
  this.mat=new THREE.PointsMaterial({
    color:(o.color===undefined?0xffa94d:o.color),
    size:(o.size===undefined?0.13:o.size),
    map:dotTex(),transparent:true,
    opacity:(o.opacity===undefined?0.95:o.opacity),
    depthWrite:false,
    blending:(o.additive===false?THREE.NormalBlending:THREE.AdditiveBlending)
  });
  this.points=new THREE.Points(geo,this.mat);
  this.points.frustumCulled=false;
}
Sparks.prototype.emit=function(p,k,spd,up,jit){
  spd=spd||2.5;if(up===undefined)up=2.8;if(jit===undefined)jit=0.7;
  for(var i=0;i<k;i++){
    var j=this.cursor=(this.cursor+1)%this.n;
    this.pos[j*3]=p.x+(Math.random()-.5)*jit;
    this.pos[j*3+1]=p.y+(Math.random()-.5)*jit*.5;
    this.pos[j*3+2]=p.z+(Math.random()-.5)*jit;
    this.vel[j*3]=(Math.random()-.5)*spd;
    this.vel[j*3+1]=Math.random()*up+.4;
    this.vel[j*3+2]=(Math.random()-.5)*spd;
    this.life[j]=this.maxLife*(.4+Math.random()*.6);
  }
};
Sparks.prototype.update=function(dt){
  for(var i=0;i<this.n;i++){
    if(this.life[i]<=0)continue;
    this.life[i]-=dt;
    if(this.life[i]<=0){this.pos[i*3+1]=-999;continue;}
    this.vel[i*3+1]+=this.g*dt;
    this.pos[i*3]+=this.vel[i*3]*dt;
    this.pos[i*3+1]+=this.vel[i*3+1]*dt;
    this.pos[i*3+2]+=this.vel[i*3+2]*dt;
    if(this.bounce&&this.pos[i*3+1]<.02){
      this.pos[i*3+1]=.02;this.vel[i*3+1]*=-.35;this.vel[i*3]*=.7;this.vel[i*3+2]*=.7;
    }
  }
  this.attr.needsUpdate=true;
};

/* ============ fluxo de partículas (carga / gás) ============ */
function Flow(n,o){
  o=o||{};
  this.n=n;
  this.y0=(o.y0===undefined?0:o.y0);
  this.y1=(o.y1===undefined?5:o.y1);
  this.r=(o.r===undefined?1:o.r);
  this.dir=(o.dir===undefined?1:o.dir);
  this.vmin=(o.vmin===undefined?.4:o.vmin);
  this.vmax=(o.vmax===undefined?1:o.vmax);
  this.pos=new Float32Array(n*3);
  this.spd=new Float32Array(n);
  for(var i=0;i<n;i++)this.reset(i,true);
  var geo=new THREE.BufferGeometry();
  this.attr=new THREE.BufferAttribute(this.pos,3);
  geo.setAttribute('position',this.attr);
  this.mat=new THREE.PointsMaterial({
    color:(o.color===undefined?0xffffff:o.color),
    size:(o.size===undefined?.12:o.size),
    map:dotTex(),transparent:true,
    opacity:(o.opacity===undefined?.85:o.opacity),
    depthWrite:false,blending:THREE.AdditiveBlending
  });
  this.points=new THREE.Points(geo,this.mat);
  this.points.frustumCulled=false;
  this.baseOp=this.mat.opacity;
}
Flow.prototype.reset=function(i,any){
  var a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*this.r;
  this.pos[i*3]=Math.cos(a)*rr;
  this.pos[i*3+2]=Math.sin(a)*rr;
  this.pos[i*3+1]=any?(this.y0+Math.random()*(this.y1-this.y0)):(this.dir>0?this.y0:this.y1);
  this.spd[i]=this.vmin+Math.random()*(this.vmax-this.vmin);
};
Flow.prototype.update=function(dt,k){
  if(k===undefined)k=1;
  this.mat.opacity=this.baseOp*clamp(k,0,1);
  this.points.visible=k>.02;
  if(k<=0)return;
  for(var i=0;i<this.n;i++){
    this.pos[i*3+1]+=this.dir*this.spd[i]*dt;
    var y=this.pos[i*3+1];
    if(this.dir>0&&y>this.y1)this.reset(i,false);
    else if(this.dir<0&&y<this.y0)this.reset(i,false);
  }
  this.attr.needsUpdate=true;
};

/* ============ rótulos 3D ============ */
function makeLabel(lines,o){
  o=o||{};
  var fs=o.fs||34,padX=24,padY=14,lh=fs*1.25;
  var cv=document.createElement('canvas');
  var cx=cv.getContext('2d');
  var fnt='600 '+fs+'px Consolas, monospace';
  cx.font=fnt;
  var w=0;
  for(var i=0;i<lines.length;i++)w=Math.max(w,cx.measureText(lines[i]).width);
  cv.width=Math.ceil(w+padX*2);
  cv.height=Math.ceil(lh*lines.length+padY*2);
  cx.font=fnt;cx.textAlign='center';cx.textBaseline='middle';
  var r=14,W=cv.width,H=cv.height;
  cx.beginPath();
  cx.moveTo(r,1);cx.arcTo(W-1,1,W-1,H-1,r);cx.arcTo(W-1,H-1,1,H-1,r);
  cx.arcTo(1,H-1,1,1,r);cx.arcTo(1,1,W-1,1,r);cx.closePath();
  cx.fillStyle='rgba(7,12,20,.8)';cx.fill();
  cx.strokeStyle='rgba(148,163,184,.4)';cx.lineWidth=2;cx.stroke();
  if(o.accent!==undefined){
    cx.fillStyle=hx(o.accent);
    cx.fillRect(6,9,5,H-18);
  }
  cx.fillStyle='#dde7f3';
  for(var j=0;j<lines.length;j++)cx.fillText(lines[j],W/2,padY+lh*(j+.5));
  var tex=new THREE.CanvasTexture(cv);
  tex.minFilter=THREE.LinearFilter;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  var s=o.scale||0.005;
  sp.scale.set(cv.width*s,cv.height*s,1);
  return sp;
}

/* ============ ambiente PMREM ============ */
function makeEnvironment(){
  try{
    var c=document.createElement('canvas');c.width=256;c.height=128;
    var g=c.getContext('2d');
    var gr=g.createLinearGradient(0,0,0,128);
    gr.addColorStop(0,'#20304c');gr.addColorStop(.45,'#101c30');
    gr.addColorStop(.5,'#2a3c55');gr.addColorStop(.56,'#16202f');gr.addColorStop(1,'#080d16');
    g.fillStyle=gr;g.fillRect(0,0,256,128);
    g.fillStyle='rgba(255,205,160,.9)';g.fillRect(36,20,52,9);
    g.fillStyle='rgba(160,200,255,.8)';g.fillRect(150,28,72,8);
    g.fillStyle='rgba(255,255,255,.5)';g.fillRect(88,58,110,4);
    var tex=new THREE.CanvasTexture(c);
    tex.mapping=THREE.EquirectangularReflectionMapping;
    var pm=new THREE.PMREMGenerator(renderer);
    var env=pm.fromEquirectangular(tex).texture;
    pm.dispose();tex.dispose();
    return env;
  }catch(e){return null;}
}

/* ============================================================
   CAP 0 — A ERA DO AÇO (abertura · diorama da evolução)
   ============================================================ */
function buildCap0(){
  var g=new THREE.Group();
  var dk=mat(0x1b2534,.75,.4),stlD=mat(0x2a3648,.6,.55),stlM=mat(0x37455c,.55,.65),
      cop=mat(0xc47a3d,.35,.9),clay=mat(0x8a5a3c,.85,.05),graphite=mat(0x2b2f36,.4,.6);

  var base=new THREE.Mesh(new THREE.BoxGeometry(13.4,.3,3.6),dk);
  base.position.y=.15;base.receiveShadow=true;g.add(base);
  var top=new THREE.Mesh(new THREE.BoxGeometry(13.5,.07,3.7),mat(0x26324a,.7,.45));
  top.position.y=.33;top.receiveShadow=true;g.add(top);

  var xs=[-5.2,-2.6,0,2.6,5.2];
  var ringMats=[],hitList=[];

  function pedestal(i){
    var x=xs[i];

      fCh=1;tCo=.25;tC=1.2;
      if(st.t>3.0){st.phase='gas';st.t=0;card();syncBtn();}
    }else if(st.phase==='gas'){
      fCh=.6;fGa=1;tCo=1;tC=2.8;
      if(st.t>3.4){st.phase='tap';st.t=0;card();syncBtn();}
    }else if(st.phase==='tap'){

      fGa=.25;fT=.5;tCo=.4;tC=4.5;
    }
    var sm=Math.min(1,dt*3);
    st.kCh+=(fCh-st.kCh)*sm;
    st.kGa+=(fGa-st.kGa)*sm;
    st.kT+=(fT-st.kT)*sm;
    st.co+=(tCo-st.co)*Math.min(1,dt*2);
    st.c+=(tC-st.c)*Math.min(1,dt*1.2);
    charge.update(dt,st.kCh);
    gas.update(dt,st.kGa);
    runMat.emissiveIntensity=st.kT*1.6*(.7+.3*Math.sin(t*6));

    glow.intensity=st.kT*2.6;

    if(st.kT>.1&&Math.random()<.5)sparks.emit(V3(0,1.15,3.3),1,1.4,2,.6);
    fume.update(dt);sparks.update(dt);
    meters();
  }
  return {group:g,st:st,cam:{theta:.7,elev:.45,radius:17,target:V3(0,3.6,0),min:9,max:28},

    }else if(st.phase==='done'){
      st.blow=Math.max(0,st.blow-dt*.5);

      scrapMat.emissiveIntensity*=Math.exp(-dt*1.5);
      ves.position.x=0;
    }
    lance.position.y=st.lanceY;
    sparks.update(dt);smoke.update(dt);
    meters();
  }
  return {group:g,st:st,cam:{theta:.5,elev:.4,radius:15,target:V3(0,3,0),min:8,max:24},
    clickables:[],btnAction:btnAction,enter:enter,update:update};

      rim.material.emissiveIntensity=.25*k;
      foamGrp.visible=k>.22;
      foamMat.emissiveIntensity=.25+.95*k;
      foamGrp.scale.setScalar(.7+.3*Math.min(1,k*2));
      foamGrp.position.y=2.2+.03*Math.sin(t*4);
      if(Math.random()<.75){
        var o=eOffs[Math.floor(Math.random()*3)];
        so.emit(V3(ex+o[0],st.eleY,o[1]),2,2.2,3.2,1.1);
      }
      if(Math.random()<.5)smokeBF.emit(V3(ex+1.0,4.0,-1.1),1,.3,.7,.25);
      setMeters();
      if(st.t>=4.8){st.phase='raise';st.t=0;card();syncBtn();}
    }else if(st.phase==='raise'){
      st.eleY=lerp(2.36,5.0,easeOut(Math.min(1,st.t/1.2)));
      lamp.intensity*=Math.exp(-dt*3);
      arcs.forEach(function(a){a.material.opacity*=.86;});
      foamMat.emissiveIntensity*=.94;
      if(st.t>=1.2){st.phase='pour';st.t=0;foamGrp.visible=false;ladle.visible=true;stream.visible=true;card();syncBtn();}
    }else if(st.phase==='pour'){
      var kk=Math.min(1,st.t/1.8);
      lglow.scale.y=Math.max(.05,kk);
      lglow.position.y=.5+.35*kk;
      lglowMat.emissiveIntensity=.6+kk*1.2;
      stream.material.opacity=.7+Math.random()*.3;
      if(Math.random()<.6)so.emit(V3(ex,2.2,3.6),2,1.6,2.2,.5);
      if(st.t>=1.8){
        st.phase='done';st.flash=1;lamp.intensity=0;stream.visible=false;
        card();syncBtn();
        toast('FEA: ~5,4 GJ/t contra ~19,8 GJ/t no alto-forno — −73% de energia');
      }
    }else if(st.phase==='done'){
      lglowMat.emissiveIntensity=lerp(1.8,.12,Math.min(1,st.t/7));
      bathMat.emissiveIntensity=lerp(1.47,.4,Math.min(1,st.t/5));
      scrapMat.emissiveIntensity*=Math.exp(-dt*1.5);
      rim.material.emissiveIntensity*=Math.exp(-dt*1.5);
    }
    st.flash=Math.max(0,st.flash-dt*2);
    car.position.y=st.eleY;
    if(Math.random()<.15)smokeBF.emit(V3(ex+1.0,4.5,-1.1),1,.25,.55,.3);
    so.update(dt);smokeBF.update(dt);
    setMeters();
  }
  return {group:g,st:st,cam:{theta:.55,elev:.4,radius:14,target:V3(0,2.2,0),min:7,max:22},
    clickables:[],btnAction:btnAction,enter:enter,update:update};
}

    heat:{t:'Calor de dentro para fora',d:'A corrente alternada na bobina cria um campo que penetra a carga e induz correntes de Foucault no próprio metal. A resistência elétrica da peça vira calor (efeito Joule): ela derrete de dentro para fora.',ch:['Correntes de Foucault','Efeito Joule','Derretimento interno → externo']},
    done:{t:'O ponto crítico: não refina',d:'Sem arco e sem escória reativa, não há remoção química de impurezas: o que entra com impureza sai com impureza — só que líquido. Ele só derrete; limpar o aço é trabalho de outro forno.',ch:['0% de remoção de impurezas','Composição idêntica','Forno de fusão, não de refino']}

      poolMat.emissiveIntensity=lerp(1.4,.15,Math.min(1,st.t/6));

/* ============ painel / navegação ============ */
function setM(id,txt){var el=EL(id);if(el)el.textContent=txt;}
var toastT;
function toast(msg){
  var el=EL('toast');
  el.textContent=msg;el.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.classList.remove('on');},3200);
}
function updatePanel(){
  var u=UI[cur];
  setM('k-kick',(u.kick||('CAPÍTULO '+u.num))+' · 06');
  setM('k-num',u.num);
  setM('k-title',u.title);
  EL('k-desc').innerHTML=u.desc;
  EL('k-controls').innerHTML=u.controls;
  EL('k-mets').innerHTML=u.metrics;
  setM('k-hint',u.hint);
  var chips=document.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++)chips[i].classList.toggle('active',i===cur);
  var segs=document.querySelectorAll('.segs button');
  for(var j=0;j<segs.length;j++)segs[j].classList.toggle('active',j<=cur);
  setM('count','0'+(cur+1)+' / 06');
  bindControls(cur);
}
function bindControls(i){
  if(i===0){
    var c0btns=document.querySelectorAll('#c0-seg button');
    for(var k0=0;k0<c0btns.length;k0++){
      (function(b){b.onclick=function(){CH[0].setSeg(parseInt(b.getAttribute('data-m'),10));};})(c0btns[k0]);
    }
    CH[0].enter();
  }
  if(i===1){
    C1.btn=EL('c1-btn');C1.coB=EL('c1-co-b');C1.coV=EL('c1-co-v');C1.cB=EL('c1-c-b');C1.cV=EL('c1-c-v');
    C1.btn.onclick=function(){CH[1].btnAction();};
    CH[1].enter();
  }
  if(i===2){
    C2.btn=EL('c2-btn');C2.tB=EL('c2-t-b');C2.tV=EL('c2-t-v');C2.cB=EL('c2-c-b');C2.cV=EL('c2-c-v');
    C2.btn.onclick=function(){CH[2].btnAction();};
    CH[2].enter();
  }
  if(i===3){
    C3.btn=EL('c3-btn');C3.afB=EL('c3-af-b');C3.afV=EL('c3-af-v');C3.eafB=EL('c3-eaf-b');C3.eafV=EL('c3-eaf-v');
    C3.btn.onclick=function(){CH[3].btnAction();};
    CH[3].enter();
  }
  if(i===4){
    C4.btn=EL('c4-btn');C4.tB=EL('c4-t-b');C4.tV=EL('c4-t-v');
    C4.btn.onclick=function(){CH[4].btnAction();};
    CH[4].enter();
  }
  if(i===5){
    C5.co2B=EL('c5-co2-b');C5.co2V=EL('c5-co2-v');
    var btns=document.querySelectorAll('#c5-seg button');
    for(var k=0;k<btns.length;k++){
      (function(b){b.onclick=function(){CH[5].setMode(parseInt(b.getAttribute('data-m'),10));};})(btns[k]);
    }
    CH[5].enter();
  }
}
function setChapter(i,instant){
  if(!instant&&i===cur)return;
  cur=i;
  var apply=function(){
    CH.forEach(function(c,j){c.group.visible=(j===i);});
    var c=CH[i].cam;
    rig.theta=c.theta;rig.elev=c.elev;rig.radius=c.radius;rig.target.copy(c.target);
    updatePanel();
  };
  if(instant){apply();return;}
  EL('veil').classList.add('on');
  setTimeout(function(){
    apply();
    requestAnimationFrame(function(){EL('veil').classList.remove('on');});
  },380);
}

/* ============ boot ============ */
function boot(){
  var load=EL('loading');
  try{
    renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputEncoding=THREE.sRGBEncoding;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.12;
    renderer.domElement.id='stage';
    document.body.insertBefore(renderer.domElement,document.body.firstChild);

    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0a101c);
    scene.fog=new THREE.Fog(0x0a101c,45,120);
    camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,220);
    raycaster=new THREE.Raycaster();ndc=new THREE.Vector2();
    clock=new THREE.Clock();

    var env=makeEnvironment();
    if(env)scene.environment=env;
    scene.add(new THREE.HemisphereLight(0x8fb3d9,0x0c1118,.55));
    var key=new THREE.DirectionalLight(0xfff1e0,1);
    key.position.set(8,13,6);key.castShadow=true;
    key.shadow.mapSize.set(2048,2048);
    key.shadow.camera.left=key.shadow.camera.bottom=-18;
    key.shadow.camera.right=key.shadow.camera.top=18;
    key.shadow.camera.near=2;key.shadow.camera.far=45;
    key.shadow.normalBias=.03;
    scene.add(key);
    var rimL=new THREE.DirectionalLight(0x5b8cff,.35);
    rimL.position.set(-9,6,-9);scene.add(rimL);

    var ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x0d1522,.95,0));
    ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    var grid=new THREE.GridHelper(90,60,0x24354e,0x16233a);
    grid.position.y=.02;grid.material.transparent=true;grid.material.opacity=.5;scene.add(grid);

    CH=[buildCap0(),buildCap1(),buildCap2(),buildCap3(),buildCap4(),buildCap5()];
    CH.forEach(function(c,i){c.group.visible=(i===0);scene.add(c.group);});

    var chips=document.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){
      (function(b){b.onclick=function(){setChapter(parseInt(b.getAttribute('data-i'),10));};})(chips[i]);
    }
    var segs=document.querySelectorAll('.segs button');
    for(var j=0;j<segs.length;j++){
      (function(b){b.onclick=function(){setChapter(parseInt(b.getAttribute('data-i'),10));};})(segs[j]);
    }
    EL('b-prev').onclick=function(){setChapter((cur+5)%6);};
    EL('b-next').onclick=function(){setChapter((cur+1)%6);};
    EL('fold').onclick=function(){EL('panel').classList.toggle('off');};
    window.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight')setChapter((cur+1)%6);
      if(e.key==='ArrowLeft')setChapter((cur+5)%6);
    });

    var cvs=renderer.domElement;
    cvs.addEventListener('pointerdown',function(e){
      drag=true;moved=0;px=e.clientX;py=e.clientY;
      try{cvs.setPointerCapture(e.pointerId);}catch(_e){}
    });
    cvs.addEventListener('pointermove',function(e){
      if(drag){
        var dx=e.clientX-px,dy=e.clientY-py;
        px=e.clientX;py=e.clientY;
        moved+=Math.abs(dx)+Math.abs(dy);
        rig.theta-=dx*.0052;
        rig.elev=clamp(rig.elev+dy*.0042,.1,1.3);
      }else hoverCheck(e);
    });
    cvs.addEventListener('pointerup',function(e){drag=false;if(moved<7)clickCheck(e);});
    cvs.addEventListener('pointercancel',function(){drag=false;});
    cvs.addEventListener('wheel',function(e){
      e.preventDefault();
      var c=CH[cur].cam;
      rig.radius=clamp(rig.radius+e.deltaY*.012,c.min,c.max);
    },{passive:false});
    window.addEventListener('resize',function(){
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    setChapter(0,true);
    if(load&&load.parentNode)load.parentNode.removeChild(load);
    animate();
  }catch(e){
    if(load&&load.parentNode)load.parentNode.removeChild(load);
    fatal('Falha ao iniciar a cena 3D: '+(e&&e.message?e.message:e));
  }
}

/* ============ picking ============ */
function pick(e){
  if(!CH.length||!CH[cur])return null;
  var r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  var list=CH[cur].clickables||[];
  if(!list.length)return null;
  var hits=raycaster.intersectObjects(list.map(function(l){return l.obj;}),true);
  if(!hits.length)return null;
  var o=hits[0].object;
  while(o){
    for(var i=0;i<list.length;i++){if(list[i].obj===o)return list[i];}
    o=o.parent;
  }
  return null;
}
function hoverCheck(e){
  var l=pick(e);
  renderer.domElement.style.cursor=l?'pointer':'grab';
}
function clickCheck(e){
  var l=pick(e);
  if(l)l.handler();
}

/* ============ loop ============ */
function updateCamera(dt){
  if(!drag)rig.theta+=dt*.03;
  var cp=Math.cos(rig.elev),sp=Math.sin(rig.elev);
  camera.position.set(
    rig.target.x+rig.radius*cp*Math.sin(rig.theta),
    rig.target.y+rig.radius*sp,
    rig.target.z+rig.radius*cp*Math.cos(rig.theta));
  camera.lookAt(rig.target);
}
function animate(){
  if(dead)return;
  requestAnimationFrame(animate);
  try{
    var dt=Math.min(clock.getDelta(),.05);
    tG+=dt;
    if(CH[cur]&&CH[cur].update)CH[cur].update(dt,tG);
    updateCamera(dt);
    renderer.render(scene,camera);
  }catch(e){
    dead=true;
    fatal('Erro durante a animação: '+(e&&e.message?e.message:e));
  }
}

boot();
})();
</script>
